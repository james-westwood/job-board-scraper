[project]
name = "job-board-scraper"
version = "1.0.0"
description = "Weekly scrape of non-API careers sites for data/ML roles"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.45",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
